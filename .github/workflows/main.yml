name: hello-world
on:
  push:
    branches:
      - main
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Run the main.js script
      - name: Run main.js
        run: node main.js
